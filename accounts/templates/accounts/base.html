{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Register{% endblock %}</title>
  <link rel="icon" href="{% static 'accounts/img/logo.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="{% url 'home' %}" class="logo" aria-label="Home">
        <img src="{% static 'accounts/img/logo.svg' %}" alt="Logo">
      </a>
      <nav class="topbar__actions">
        {% if user.is_authenticated %}
          {% if perms.accounts.view_all_profiles %}
            <a href="{% url 'members' %}" class="btn btn--ghost">Members</a>
          {% endif %}
          <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}
            <button type="submit" class="btn btn--dark">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn--ghost">Log in</a>
          <a href="{% url 'register' %}" class="btn btn--dark">Register</a>
        {% endif %}
      </nav>
    </header>

    <main class="main">{% block content %}{% endblock %}</main>

    <footer class="footer">
      <div class="footer__icons">
        <a href="#" aria-label="Facebook" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </a>
        <a href="#" aria-label="Instagram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </a>
        <a href="#" aria-label="LinkedIn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
        <a href="#" aria-label="X" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20"/></svg>
        </a>
        <a href="#" aria-label="YouTube" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>
        </a>
      </div>
      <nav class="footer__links">
        <a href="#">Privacy</a><a href="#">Terms</a><a href="#">Help</a>
      </nav>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
