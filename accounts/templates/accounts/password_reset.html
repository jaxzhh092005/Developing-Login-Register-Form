{% extends "accounts/base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="card card--solo">
  <h1>Forgot password?</h1>
  <p class="card__sub">Enter your email and we’ll send you a reset link.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for e in form.email.errors %}<p class="error">{{ e }}</p>{% endfor %}
    <div class="field"><input type="email" name="email" placeholder="Email" autocomplete="email" required></div>
    <button type="submit" class="btn btn--submit">Send reset link</button>
  </form>
  <p class="card__foot"><a href="{% url 'login' %}">Back to log in</a></p>
</section>
{% endblock %}
